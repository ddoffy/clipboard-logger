[package]
name = "clipboard-logger"
version = "0.1.0"
edition = "2024"
author = "D. Doffy <cuongnsm@gmail.com>"
description = "A daemon service for logging clipboard contents to a CSV file"

[dependencies]
arboard = "3.5.0"
chrono = "0.4.40"
clap = {version= "4.5.36", features = ["derive"] }
csv = "1.3.1"
daemonize = "0.5.0"
directories = "6.0.0"
image = "0.25.6"
serde = { version = "1.0.219", features = ["derive"] }
whoami = "1.6.0"
reqwest = { version = "0.11.16", features = ["blocking", "json", "multipart"] }
serde_json = "1.0.104"
tokio = { version = "1.47.1", features = ["full"] }
